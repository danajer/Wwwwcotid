# netlify.toml

[build]
  # Direktori output untuk fungsi
  functions = "netlify/functions"

[functions]
  # Konfigurasi untuk function send-notification
  [functions."send-notification"]
    # Timeout dalam detik (default: 15, maks: 26 untuk free tier)
    timeout = 10
    
    # Memory allocation dalam MB (default: 1024)
    memory = 1024

# Redirects untuk SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
